name: Fork PR

# techneissa's fork: the check a pull request to `custom` waits for is `fork-gate` (fork/github-builds.md).
# It tests what the pull request can break, not the whole workspace: the changed crates and every crate that
# depends on them (fork/pr_plan.py), the tests split over three machines. ci.yml skips pull requests into
# `custom` (a `branches-ignore` hook); a push to `custom` still runs the full `cargo xtask ci` through Fork CI.
# Same machine set-up as ci.yml and the shared gate workflow in storytold/craft-common-actions (apt packages,
# craft-fonts commit, Rust install, cache); the tests run through the runner in .cargo/config.toml, which skips
# the accepted failures in fork/known-failures.txt.

on:
  pull_request:
    branches: [custom]

permissions:
  contents: read

# A newer push to the pull request cancels its older run.
concurrency:
  group: fork-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  # Line tables are enough for backtraces and make the debug build much smaller and faster (as the shared gate).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # As `cargo xtask ci` runs its tests: more threads make the frame-budget tests flaky.
  RUST_TEST_THREADS: 4
  CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
  CRAFT_FONTS_REQUIRED: 1

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      clippy_args: ${{ steps.plan.outputs.clippy_args }}
      wasm: ${{ steps.plan.outputs.wasm }}
      parity: ${{ steps.plan.outputs.parity }}
      heif: ${{ steps.plan.outputs.heif }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      # Two commits: the pull request's merge commit and its first parent, the tip of `custom`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Test the plan script
        run: python3 fork/test_pr_plan.py

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          python3 fork/pr_plan.py --base HEAD^1 --github-output 2> "$RUNNER_TEMP/plan.txt" > /dev/null
          cat "$RUNNER_TEMP/plan.txt"
          { echo '### Plan'; echo '```'; cat "$RUNNER_TEMP/plan.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  quick:
    name: quick
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          # Same craft-fonts commit as ci.yml (fork/test_pr_plan.py checks it).
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false

      - name: Install Linux build dependencies
        uses: storytold/craft-common-actions/actions/install-apt-packages@44a7db40b1a3e99eed02c88f89f38cdd6cfffe81 # main, 2026-11-01
        with:
          # Same packages as ci.yml (fork/test_pr_plan.py checks it).
          packages: >-
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
            libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
            libgl1-mesa-dev libdbus-1-dev

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update --component clippy --component rustfmt --target wasm32-unknown-unknown
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: fork-pr-v1-rust
          key: quick
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        if: needs.plan.outputs.rust == 'true'
        env:
          CLIPPY_ARGS: ${{ needs.plan.outputs.clippy_args }}
        run: |
          # shellcheck disable=SC2086 # the planned crates are separate arguments
          cargo clippy $CLIPPY_ARGS --all-targets -- -D warnings

      - name: Clippy with the heif decoder
        if: needs.plan.outputs.heif == 'true'
        run: cargo clippy -p lightcraft-codecs --features heif --all-targets -- -D warnings

      - name: Layers
        run: cargo xtask layers

      - name: Assets
        run: cargo xtask assets

      - name: Parity
        if: needs.plan.outputs.parity == 'true'
        run: cargo xtask parity

      - name: Wasm
        if: needs.plan.outputs.wasm == 'true'
        run: cargo xtask wasm

  tests:
    name: tests (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # A failing group must not cancel the others and hide their failures.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false

      # Nothing waits on it: the space is free before the build needs it.
      - name: Free disk space
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &

      - name: Install Linux build dependencies
        uses: storytold/craft-common-actions/actions/install-apt-packages@44a7db40b1a3e99eed02c88f89f38cdd6cfffe81 # main, 2026-11-01
        with:
          packages: >-
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
            libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
            libgl1-mesa-dev libdbus-1-dev

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: fork-pr-v1-rust
          key: tests-${{ matrix.group }}
          cache-on-failure: true

      - name: Tests
        if: matrix.packages != ''
        env:
          PACKAGES: ${{ matrix.packages }}
          DOC_PACKAGES: ${{ matrix.doc_packages }}
        run: |
          set -euo pipefail
          # the planned crates are separate arguments (`-p a -p b`)
          read -ra packages <<< "$PACKAGES"
          read -ra doc_packages <<< "$DOC_PACKAGES"
          start=$(date +%s)
          cargo test "${packages[@]}" --lib --bins --tests
          if [ "${#doc_packages[@]}" -gt 0 ]; then cargo test "${doc_packages[@]}" --doc; fi
          echo "tests group ${{ matrix.name }}: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tests with the heif decoder
        if: matrix.heif
        run: |
          set -euo pipefail
          cargo test -p lightcraft-codecs -p lightcraft-heif --features lightcraft-codecs/heif --lib --bins --tests
          cargo test -p lightcraft-engine --lib --features lightcraft-codecs/heif heic

  # The check a pull request waits for: passes only when the plan, the quick checks and every test group passed.
  fork-gate:
    name: fork-gate
    if: always()
    needs: [plan, quick, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          PLAN: ${{ needs.plan.result }}
          QUICK: ${{ needs.quick.result }}
          TESTS: ${{ needs.tests.result }}
          RUST: ${{ needs.plan.outputs.rust }}
        run: |
          echo "plan: $PLAN, quick: $QUICK, tests: $TESTS (crates to test: $RUST)"
          [ "$PLAN" = success ] && [ "$QUICK" = success ] || exit 1
          # The tests are skipped only when the plan found no crate to test.
          if [ "$RUST" = true ]; then [ "$TESTS" = success ] || exit 1; else [ "$TESTS" = skipped ] || exit 1; fi
