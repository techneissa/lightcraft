name: Fork CI

# techneissa's fork (FORK.md): the checks on GitHub's machines, so the full suite never runs on techneissa's Mac.
# One workflow for both events, through the suite's shared gate (the same set-up as ci.yml: Ubuntu packages,
# craft-fonts commit, Rust, cache) running fork/ci.sh as seven jobs at once (GROUPS in fork/affected.py):
#   - a pull request to `custom` tests the crates it can affect (fork/affected.py);
#   - a push to `custom` (the daily upstream merge included) tests everything, as `cargo xtask ci` does.
# The accepted failures in fork/known-failures.txt are skipped by cargo's test runner on Linux
# (.cargo/config.toml), so a red run is a new failure. `fork-gate` is the check a pull request waits for.
# The official CI workflow (ci.yml) is untouched; it is switched off in the repo's Actions settings instead
# (fork/github-builds.md). fork-build.yml pushes its daily merge with FORK_PUSH_TOKEN, so that merge is tested too.

on:
  # Not on pull requests (techneissa, 2026-11-03): a batch of PRs is merged and tested once, so a
  # run per PR (and again after each fix) only repeated the work.
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ci.yml's gate inputs that change upstream (its Ubuntu packages, the craft-fonts commit), read from ci.yml so
  # the fork never pins its own copy.
  pins:
    # never in the official repo, should this file ever travel upstream
    if: github.repository == 'techneissa/lightcraft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.read.outputs.packages }}
      craft-fonts-ref: ${{ steps.read.outputs.fonts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: read
        run: |
          packages="$(yq '.jobs.gate.with.packages' .github/workflows/ci.yml | tr '\n' ' ')"
          fonts="$(yq '.jobs.gate.with."craft-fonts-ref"' .github/workflows/ci.yml)"
          if [ -z "$packages" ] || [ "$packages" = "null " ] || [ -z "$fonts" ] || [ "$fonts" = "null" ]; then
            echo "::error::ci.yml's gate job no longer has packages or craft-fonts-ref: update fork-ci.yml"
            exit 1
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "fonts=$fonts" >> "$GITHUB_OUTPUT"

  # Seven machines at once (free for a public repo): ui-egui's tests split over the last four (SHARDS in
  # fork/affected.py), the other crates over the first three. Group 1 also runs fmt, clippy, layers, assets, parity
  # and wasm.
  gate:
    needs: pins
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7]
    # Tracks @main like ci.yml, so suite-wide CI fixes reach this fork too.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      packages: ${{ needs.pins.outputs.packages }}
      craft-fonts-ref: ${{ needs.pins.outputs.craft-fonts-ref }}
      # as ci.yml: cargo test, not nextest (the demo scene cache is per process)
      tools: ""
      # no debug info (the gate's default is line tables): a failing test still names its file and line, and
      # nothing on the runners reads more, so the builds compile and link less (techneissa, 2026-11-05)
      dev-debug: "0"
      # a run by hand on `custom` saves the dependency cache that pull requests then restore
      cache-save-on-dispatch: ${{ github.event_name == 'workflow_dispatch' }}
      timeout-minutes: 75
      command: sh fork/ci.sh --part ${{ matrix.part }}/7

  # The check a pull request waits for: passes only when every group passed.
  fork-gate:
    name: fork-gate
    if: always()
    needs: [pins, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every group passed
        env:
          PINS: ${{ needs.pins.result }}
          GATE: ${{ needs.gate.result }}
        run: |
          echo "pins: $PINS, gate: $GATE"
          [ "$PINS" = success ] && [ "$GATE" = success ]
