[package]
name = "lightcraft-lama"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "LightCraft learned fill: LaMa (big-lama) large-hole inpainting in pure Rust on Candle (L3)"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zip = { version = "7.4", default-features = false }
candle-core = { workspace = true }
candle-nn = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[dev-dependencies]
zip = { version = "7.4", default-features = false }
image = { workspace = true }
lightcraft-testkit = { workspace = true }
